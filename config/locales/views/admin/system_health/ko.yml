ko:
  admin:
    system_health:
      hosted_usage:
        loading: 호스팅 사용량 불러오는 중…
        title: 호스팅 사용량
        snapshot: '%{time} 기준 읽기 전용 데이터베이스 스냅샷'
        summary:
          trial_households_count: 체험판 가구 (최근 30일)
          trial_members_count: 현재 체험판 회원 계정
          trials_expiring_soon_count: 향후 7일 내 만료되는 체험판
          cleanup_eligible_count: 정리 대상 가구
          active_supporter_households_count: 활성 후원자 가구 (로컬)
          supporter_subscription_count: Stripe 연동 구독 레코드
        summary_help: 체험판 합계에는 최근 30일 동안 기록된 구독이 포함됩니다. 곧 만료되는 체험판, 정리 대상 및 후원자 합계는
          표의 행 제한 없이 현재 조건에 맞는 모든 레코드를 포함합니다.
        limitations_title: 이 수치로 알 수 있는 내용
        limitations: 현재 테이블에는 전체 체험판, 결제 또는 세션 활동 이력이 보존되지 않습니다. 구독 생성 기록은 가져오기 작업의
          결과일 수 있습니다. 회원 계정 수가 고유한 사람 수를 의미하지는 않습니다. 이 화면은 가구나 구독 데이터를 변경하지 않습니다.
          공유 데모를 초기화하면 이전 가구와 세션이 삭제되어 방문자 이력을 복원할 수 없습니다.
        trials:
          title: 최근 체험판 가구
          description: '%{date} 이후 기록되었으며 체험판 종료일이 남아 있는 구독입니다. 전환된 체험판도 포함됩니다. 최대
            %{limit}개 가구를 표시합니다.'
          sessions_help: 세션은 활성화된 사용자의 로그인 기록이며 현재 온라인인 사용자나 방문 횟수가 아닙니다. 로그아웃하면 기록이
            삭제됩니다. 가장 최근 생성 시각은 마지막 접속 시각이 아닙니다.
          empty: 이 기간에 기록된 체험판 가구가 없습니다
        cleanup:
          title: 정리 대상 여부
          description: 기존 정리 범위와 일치합니다. 일시중지 또는 체험판 구독이 14일 넘게 전에 종료되었거나, 구독이 없고 가구가
            45 + 14일보다 오래된 경우입니다. 최대 %{limit}개 가구를 표시합니다.
          eligibility_help: 최근 로그인 여부는 대상 판정에 영향을 주지 않습니다. 대상이라고 해서 삭제가 확인된 것은 아닙니다.
            90일은 보관 기간이며 체험판 정리 기준이 아닙니다.
          disabled: 관리형 모드가 아니면 예약된 체험판 정리가 비활성화됩니다. 여기에 표시되는 것은 범위 조건과 일치하는 항목뿐입니다.
          empty: 정리 범위에 해당하는 가구가 없습니다
          reasons:
            expired_trial_grace_elapsed: 체험판 종료; 14일 유예 기간 경과
            no_subscription_grace_elapsed: 구독 없음; 45 + 14일 경과
        supporters:
          title: 로컬 후원자 상태
          description: Stripe 형식의 고객 ID와 구독 ID가 있는 현재 로컬 구독 레코드입니다. 합성 데모 구독은 제외됩니다.
            상태만으로 실제 결제 수령 여부나 최초 결제일을 확인할 수 없습니다. Stripe 요청은 전송되지 않습니다.
          empty: Stripe 연동 구독 레코드가 없습니다
        columns:
          household: 가구 ID
          recorded_at: 구독 기록 시각
          trial_ends_at: 체험판 종료
          status: 현재 상태
          members: 회원 계정
          retained_sessions: 보존된 로그인 세션
          recent_sessions: 최근 30일 내 생성된 보존 세션
          latest_session: 가장 최근 보존 로그인
          cleanup_eligible: 정리 대상
          cleanup_reason: 사유
          subscription_rows: 구독 레코드
        statuses:
          unknown: 알 수 없음
          incomplete: 미완료
          incomplete_expired: 미완료, 만료됨
          trialing: 체험판 진행 중
          active: 활성
          past_due: 결제 기한 경과
          canceled: 취소됨
          unpaid: 미결제
          paused: 일시중지됨
          no_subscription: 구독 없음
        not_recorded: 기록되지 않음
        eligible: 대상
        not_eligible: 대상 아님
        synthetic_demo: 합성 데모
      push_notifications:
        send_test: 푸시 알림 테스트 전송
        queueing: 대기열에 추가하는 중…
        title: 푸시 알림
        requested_at: 최근 테스트 요청 시각 %{time}
        result_help: APNs가 요청을 수락해도 기기에 전달되었다는 뜻은 아닙니다. 새로고침하여 워커 결과를 확인하세요. 결과는 24시간
          동안 보관됩니다.
        results_label: 테스트 결과
        device: 기기 %{number}
        pending: 대기 중
        refresh: 결과 새로고침
        columns:
          device: 기기
          environment: APNs 환경
          status: 결과
          checked_at: 최근 업데이트
        environments:
          sandbox: 샌드박스
          production: 프로덕션
        messages:
          enqueue_failed: 테스트를 대기열에 추가하지 못했습니다. Sidekiq를 확인하고 아래 결과를 새로고침하세요.
          ready: 계정에 등록된 활성 iOS 기기로 테스트 알림을 전송합니다.
          queued: 테스트 알림이 대기열에 추가되었습니다. 아래 결과를 새로고침하여 상태를 확인하세요.
          hosted_only: 푸시 알림은 호스팅 모드에서만 사용할 수 있습니다.
          ineligible: 활성 슈퍼 관리자만 테스트 알림을 전송할 수 있습니다.
          no_devices: 테스트를 보내려면 이 계정의 Sure iOS 앱에서 푸시 알림을 활성화하세요.
          disabled: 운영자가 푸시 전송을 비활성화했습니다.
          not_configured: APNs 자격 증명이 설정되지 않았습니다.
          cooldown: 다음 테스트를 보내기 전에 30초 기다려 주세요.
          storage_unavailable: 테스트 요청을 저장하지 못했습니다. 공유 캐시 설정을 확인하세요.
        statuses:
          queued: 대기열에 추가됨
          accepted: APNs에서 수락됨
          skipped: '건너뜀: 더 이상 대상이 아님'
          rejected: APNs에서 거부됨; 푸시 디버그 로그를 확인하세요
          unregistered: 기기 등록이 더 이상 유효하지 않습니다
          retrying: 일시적인 오류로 재시도 중
          failed: 실패; 푸시 디버그 로그를 확인하세요
          enqueue_failed: 대기열 추가 실패; Sidekiq를 확인하세요
          expired: 최종 결과 없이 만료됨
      push_notification:
        title: Sure 테스트 알림
        body: Sure 계정의 푸시 알림 테스트입니다.
      verify_worker_ai:
        queued: 워커 확인 작업을 대기열에 추가했습니다. 워커 프로세스가 처리하면 아래에 표시되며, 보통 몇 초 정도 걸립니다.
      optional_services:
        title: 선택적 서비스
        description: 운영자용 선택적 연동 서비스입니다. 설정되지 않은 서비스는 참고 정보로만 표시됩니다. 이 검사는 설정만 확인하며
          연결을 테스트하거나 테스트 이벤트를 보내거나 분석 동의 설정을 변경하지 않습니다. 설정 세부 정보를 보려면 서비스를 펼치세요.
        missing_settings: '누락된 설정: %{settings}'
        statuses:
          configured: 설정됨
          not_configured: 설정되지 않음
          incomplete: 설정 불완전
          disabled: 이 프로세스에서 비활성화됨
          not_checked: 확인되지 않음
        notes:
          environment_disabled: 이 Rails 환경에서 로드된 연동 기능이 비활성화되어 있습니다.
          explicitly_disabled: SKYLIGHT_ENABLED 설정으로 계측이 명시적으로 비활성화되어 있습니다.
          self_hosted_checkout_disabled: 셀프 호스팅 모드에서는 구독 결제와 결제 포털을 사용할 수 없습니다. Stripe
            웹훅은 계속 설정할 수 있으며, 여기서는 결제 가격 ID가 필요하지 않습니다.
          browser_analytics_disabled: 이 환경에서는 브라우저 분석이 비활성화되어 있습니다. 별도로 설정된 서버 클라이언트에는
            영향을 주지 않습니다.
          shared_feedback_configured: 셀프 호스팅 피드백은 별도의 번들 프로젝트를 사용하며 해당 설정에 따라 활성화됩니다.
            운영자 POSTHOG_KEY는 필요하지 않습니다. 브라우저 옵트아웃 및 SDK 사용 가능 여부는 확인하지 않습니다.
          shared_feedback_disabled: 별도의 셀프 호스팅 피드백 프로젝트가 피드백 또는 환경 설정에 따라 비활성화되어 있습니다.
            운영자 소유 분석 기능에는 영향을 주지 않습니다.
          production_only: 현재 애플리케이션 설정에서 이 연동은 프로덕션 환경에서만 사용됩니다.
        services:
          langfuse:
            title: Langfuse
            description: 선택적 AI 추적 및 평가 보고 기능입니다. 이 검사에서는 추적 데이터나 평가 요청을 보내지 않습니다.
            guidance: LANGFUSE_PUBLIC_KEY와 LANGFUSE_SECRET_KEY를 함께 설정하세요. LANGFUSE_HOST는
              선택 사항입니다. 설정 변경 후 해당 서비스를 다시 시작하세요.
          sentry:
            title: Sentry
            description: 선택적 오류 및 성능 보고 기능입니다. 현재 초기화 설정에서는 프로덕션 환경에서만 보고 기능을 활성화합니다.
            guidance: SENTRY_DSN을 설정하고 해당 서비스를 다시 시작하세요. 오류를 캡처하거나 이벤트를 보내지 않고 로드된
              SDK 설정을 확인합니다.
          skylight:
            title: Skylight
            description: 선택적 애플리케이션 성능 계측 기능입니다. 설정이 존재한다고 해서 에이전트가 실행 중이거나 데이터를 보고하고
              있음을 의미하지는 않습니다.
            guidance: SKYLIGHT_AUTHENTICATION을 설정하고 의도한 Rails 환경에서 Skylight가 로드되었는지
              확인하세요. SKYLIGHT_ENABLED=false는 계측을 비활성화하며, 이 플래그만으로 gem이 로드되지는 않습니다.
              변경 후 다시 시작하세요.
          stripe:
            title: Stripe
            description: 선택적 구독 결제 및 결제 웹훅 기능입니다. 이 검사는 Stripe 클라이언트를 생성하거나 자격 증명을
              검증하거나 결제 요청을 보내지 않습니다.
            guidance: STRIPE_SECRET_KEY와 STRIPE_WEBHOOK_SECRET을 함께 설정하세요. 관리형 구독 결제에는
              STRIPE_MONTHLY_PRICE_ID와 STRIPE_ANNUAL_PRICE_ID도 필요합니다.
          posthog:
            title: PostHog
            description: 부팅 시 로드된 설정을 사용하는 선택적 운영자 소유 분석 기능입니다. 설정되어 있어도 사용자가 분석에
              동의했다는 뜻은 아닙니다.
            guidance: POSTHOG_KEY와 비어 있지 않은 POSTHOG_HOST를 설정하거나 기본값을 사용하려면 호스트 설정을
              생략하세요. 브라우저 분석은 프로덕션 환경 또는 개발 환경의 POSTHOG_DEVELOPMENT_ENABLED가 필요합니다.
              POSTHOG_FEEDBACK_ENABLED는 운영자 분석이 아닌 별도의 셀프 호스팅 피드백을 제어합니다.
          logtail:
            title: Logtail
            description: 선택적 프로덕션 로그 전달 기능입니다. 설정되지 않은 경우 애플리케이션은 표준 출력으로 계속 로그를 기록합니다.
            guidance: LOGTAIL_API_KEY와 LOGTAIL_INGESTING_HOST를 함께 설정하고 해당 서비스를 다시
              시작하세요. 이 검사에서는 테스트 로그를 기록하지 않습니다.
      configuration:
        description: 이 웹 프로세스에서 확인할 수 있는 설정입니다. 이 검사는 이메일을 보내거나 공급자에 연결하거나 파일을 업로드
          또는 다운로드하지 않습니다. 설정됨은 설정값이 존재한다는 뜻일 뿐, 전달·공급자 접근·저장소 접근이 검증되었다는 의미는 아닙니다.
        statuses:
          configured: 설정됨
          not_configured: 설정되지 않음
          incomplete: 설정 불완전
          disabled: 비활성화됨
          not_checked: 확인되지 않음
        settings_needed: 검토할 설정
        unknown_provider: 인식할 수 없는 공급자 선택
        provider_statuses:
          configured: 설정됨
          not_configured: API 키 누락
          invalid: 잘못된 선택
        configure_providers: 셀프 호스팅 설정 열기
        storage_backend: '선택한 저장소: %{backend}'
        storage_backends:
          local: 로컬 디스크
          test: 테스트 디스크
          amazon: Amazon S3
          cloudflare: Cloudflare R2
          generic_s3: S3 호환 저장소
          google: Google Cloud Storage
          other: 사용자 지정 또는 인식할 수 없는 백엔드
        checks:
          smtp:
            title: 이메일(SMTP)
            statuses:
              configured: SMTP 설정이 입력되어 있습니다.
              not_configured: SMTP가 설정되지 않았습니다. SMTP를 통한 비밀번호 재설정, 초대 및 기타 시스템 이메일을
                보낼 수 없습니다.
              incomplete: 일부 이메일 설정이 누락되었거나 불완전합니다. 시스템 이메일 또는 이메일에 포함된 링크가 작동하지 않을
                수 있습니다.
              disabled: 실행 중인 메일러 설정에서 이메일 전송이 비활성화되어 있습니다.
              not_checked: 이 프로세스는 개발용 미리보기 등 SMTP가 아닌 전송 방식을 사용합니다. SMTP 전송 여부는 평가하지
                않습니다.
            guidance: 관리 UI에서는 SMTP를 설정할 수 없습니다. 웹 및 워커 서비스 모두에 이메일 환경 변수를 설정한 다음
              두 서비스를 다시 시작하세요. 인증 없는 릴레이에서는 SMTP_USERNAME과 SMTP_PASSWORD를 둘 다 생략할
              수 있습니다.
            issues:
              address: SMTP_ADDRESS
              port: SMTP_PORT (1~65535 숫자)
              sender: EMAIL_SENDER (기본값 sender@sure.local을 바꾸세요)
              app_domain: APP_DOMAIN (이메일 링크에 사용)
              authentication: SMTP_USERNAME 및 SMTP_PASSWORD (둘 다 입력하거나 둘 다 생략)
          securities:
            title: 시장 가격
            statuses:
              configured: 활성화된 모든 시장 가격 공급자가 설정되어 있습니다.
              not_configured: 활성화된 시장 가격 공급자에 API 키가 누락되어 있습니다. 해당 공급자를 통한 자동 종목 검색과
                가격 조회를 사용할 수 없습니다.
              incomplete: 활성화된 공급자 중 하나 이상에 설정 누락 또는 잘못된 선택이 있습니다. 해당 공급자에 지정된 종목의
                가격이 갱신되지 않을 수 있습니다.
              disabled: 활성화된 시장 가격 공급자가 없습니다. 자동 종목 검색과 가격 조회를 사용할 수 없습니다.
            guidance: 셀프 호스팅 설정에서 공급자를 선택하고 필요한 API 키를 추가하거나 배포 환경에서 설정하세요. 환경 변수
              재정의가 우선 적용됩니다. 공개 공급자는 API 키가 필요하지 않습니다.
          exchange_rates:
            title: 환율
            statuses:
              configured: 선택한 환율 공급자가 설정되어 있습니다.
              not_configured: 사용 가능한 환율 공급자가 설정되지 않았습니다. 저장된 환율이 없을 때 자동 환산을 사용할 수
                없을 수 있습니다.
            guidance: 셀프 호스팅 설정에서 환율 공급자를 선택하고 필요한 경우 API 키를 추가하거나 배포 환경에서 설정하세요.
              EXCHANGE_RATE_PROVIDER 및 공급자 API 키 환경 변수 재정의가 우선 적용됩니다.
            issues:
