                실패합니다.
          storage:
            title: 파일 업로드 및 저장소
            statuses:
              configured: 저장소 설정이 입력되어 있습니다. 로컬 디스크에는 클라우드 자격 증명이 필요하지 않습니다.
              not_configured: 선택한 저장소 백엔드에 해당하는 설정이 없습니다. 파일 업로드를 사용할 수 없을 수 있습니다.
              incomplete: 필수 저장소 설정이 누락되었거나 불완전합니다. 파일 업로드 또는 검색이 작동하지 않을 수 있습니다.
              not_checked: 이 백엔드는 외부 자격 증명 탐색이나 사용자 지정 설정을 사용합니다. 이 설정만으로는 접근 가능 여부를
                판단할 수 없습니다.
            guidance: ACTIVE_STORAGE_SERVICE와 선택한 백엔드의 배포 설정을 확인하세요. 로컬 디스크는 웹 및 워커
              서비스가 공유하는 영구 저장소가 필요합니다. 백엔드를 변경해도 기존 파일은 이전되지 않으므로 별도로 이전을 계획하세요.
            issues:
              root: 로컬 저장소 경로
              bucket: 저장소 버킷
              region: 저장소 리전
              credentials: 저장소 액세스 키 및 시크릿 키 (둘 다 입력하거나 외부 자격 증명 탐색 사용)
              endpoint: 저장소 엔드포인트 (R2의 경우 CLOUDFLARE_ACCOUNT_ID도 필요)
      show:
        title: 시스템 상태
        tabs:
          hosted_usage: 사용량
          background_jobs: 작업
          ai: AI
          configuration: 설정
        alert:
          title: 백그라운드 작업이 실행되고 있지 않습니다
        status_section_title: Sidekiq 상태
        status_section_description: 동기화, 잔액 및 순자산 계산을 처리하는 백그라운드 작업자의 현재 상태입니다.
        counters_section_title: 작업 카운터
        counters_section_description: 모든 대기열의 Sidekiq 카운터 집계입니다.
        queues_section_title: 대기열
        queues_section_description: 대기열별 작업 수와 가장 오래된 작업의 대기 시간입니다. 지연 시간은 가장 오래된
          작업이 기다린 초 단위 시간입니다.
        labels:
          status: 상태
          processes: 작업자 프로세스
          last_heartbeat: 마지막 하트비트
          max_queue_latency: 가장 오래된 작업의 대기 시간
          enqueued: 대기열에 추가됨
          retries: 재시도
          failed: 실패
          processed_total: 총 처리 수
          queue: 대기열
          size: 크기
          latency: 지연 시간
        values:
          healthy: 정상
          unhealthy: 저하됨
          time_ago: '%{time_ago} 전'
          never: 없음
          seconds: '%{seconds}초'
          no_queues: 등록된 대기열이 없습니다. 작업자가 실행 중이 아닐 수 있습니다.
        ai:
          run_checks: 다시 검사 실행
          last_checked: 실시간 검사를 %{time_ago} 전에 완료했습니다. 결과는 잠시 동안 캐시됩니다.
          not_checked_help: 서비스 응답 여부를 확인하려면 AI 상태 URL을 직접 열거나 검사를 실행하세요.
          loading: 실시간 검사 실행 중…
          alerts:
            custom_openai:
              title: 이 사용자 지정 엔드포인트의 호스팅 벡터 저장소 검사가 실패했습니다
              message: 설정된 엔드포인트가 /v1/vector_stores 응답 확인을 통과하지 못했습니다. 대부분의 로컬 및 OpenAI
                호환 엔드포인트는 해당 API를 구현하지 않습니다. 채팅과 PDF 처리는 계속 작동할 수 있습니다. 일반적인 로컬 설정에는
                별도의 임베딩 엔드포인트와 함께 pgvector를 사용하세요. 실패 기록은 설정 → 디버그 로그와 Rails.logger에
                저장되었습니다.
            function_calling_unsupported:
              title: 모델이 함수 호출을 지원하지 않습니다
              message: 엔드포인트는 일반 채팅 요청에는 응답했지만, tools 매개변수를 포함한 동일한 요청은 거부했습니다. AI
                어시스턴트는 함수 호출을 통해 계정, 거래, 보유 자산을 읽으므로 도구를 지원하는 모델을 선택할 때까지 채팅이 계속 실패하며,
                종종 도움이 되지 않는 404 오류가 발생합니다. 제공업체가 함수 호출 지원을 명시한 모델을 선택하세요. 실패 기록은
                설정 → 디버그 로그와 Rails.logger에 저장되었습니다.
            function_calling_not_used:
              title: 모델이 호출하라는 도구를 호출하지 않고 응답했습니다
              message: 엔드포인트는 tools 매개변수를 수락했지만, 모델은 상태 확인 도구를 호출하는 대신 텍스트로 응답했습니다.
                AI 어시스턴트는 도구 호출 없이는 금융 데이터를 읽을 수 없으므로 채팅이 아무것도 답하지 않거나 꾸며낸 수치로 답할
                수 있습니다. 제공업체가 함수 호출 지원을 명시한 모델을 우선 사용하세요.
            llm_probe_failed:
              title: LLM 실시간 확인에 실패했습니다
              message: Sure에서 설정된 엔드포인트와 모델을 모두 확인하지 못했습니다. 실패 기록은 설정 → 디버그 로그와 Rails.logger에
                저장되었습니다.
            llm_model_not_available:
              title: 설정된 AI 모델을 사용할 수 없습니다
              message: 엔드포인트는 응답했지만 설정된 모델을 목록에 표시하거나 제공하지 않았습니다. 선택한 제공업체에서 사용 가능한
                모델을 선택한 후 검사를 다시 실행하세요. OpenAI 호환 변환 계층을 통해 Gemini를 사용하는 경우 현재 지원되는
                gemini-3.8-flash와 같은 모델을 사용하세요.
            pdf_text_extraction_failed:
              title: 합성 PDF 텍스트 추출 검사에 실패했습니다
              message: Sure에서 PDF에 포함된 텍스트를 로컬에서 추출한 뒤 설정된 모델로 보내는 텍스트 우선 경로를 완료하지
                못했습니다. 고객 데이터는 전송되지 않았습니다. 실패 기록은 설정 → 디버그 로그와 Rails.logger에 저장되었습니다.
            pdf_vision_processing_failed:
              title: 합성 PDF 비전/네이티브 검사에 실패했습니다
              message: Sure에서 설정된 모델을 통한 이미지 또는 네이티브 문서 PDF 경로를 완료하지 못했습니다. 고객 데이터는
                전송되지 않았습니다. 실패 기록은 설정 → 디버그 로그와 Rails.logger에 저장되었습니다.
            vector_probe_failed:
              title: 문서 검색 실시간 확인에 실패했습니다
              message: Sure에서 선택한 벡터 저장소와 필요한 모든 임베딩 서비스를 확인하지 못했습니다. 실패 기록은 설정 →
                디버그 로그와 Rails.logger에 저장되었습니다.
            pgvector_extension_not_enabled:
              title: PostgreSQL 벡터 확장이 활성화되지 않았습니다
              message: pgvector 어댑터가 선택되었지만 PostgreSQL에서 이 데이터베이스의 벡터 확장을 활성화하지 않았습니다.
                pgvector가 포함된 PostgreSQL 이미지를 사용한 다음 데이터베이스 소유자나 슈퍼유저 권한으로 확장을 활성화하고
                VECTOR_STORE_PROVIDER=pgvector로 마이그레이션을 다시 실행하세요.
            pgvector_table_not_found:
              title: vector_store_chunks 테이블이 없습니다
              message: pgvector 확장은 활성화되어 있지만 청크 테이블을 찾지 못했습니다. 마이그레이션 상태를 확인한 다음
                VECTOR_STORE_PROVIDER=pgvector로 벡터 저장소 마이그레이션을 다시 실행해 Sure에서 vector_store_chunks를
                생성하도록 하세요.
            pgvector_probe_failed:
              title: pgvector 저장소 확인에 실패했습니다
              message: Sure에서 pgvector 청크 테이블을 조회하지 못했습니다. PostgreSQL 권한, 벡터 확장, vector_store_chunks
                마이그레이션을 확인하세요. 실패 기록은 설정 → 디버그 로그와 Rails.logger에 저장되었습니다.
            embedding_dimensions_mismatch:
              title: 임베딩 차원이 일치하지 않습니다
              message: 임베딩 엔드포인트가 EMBEDDING_DIMENSIONS와 길이가 다른 벡터를 반환했습니다. EMBEDDING_MODEL과
                EMBEDDING_DIMENSIONS를 모델 문서에 명시된 벡터 크기로 설정하고, 환경 변수가 유지되도록 Sure를 재시작하세요.
                그런 다음 기존 데이터가 다른 크기를 사용했다면 pgvector 임베딩 열/테이블을 변경하거나 다시 만들고 문서를 다시
                임베딩하세요.
            embedding_probe_timeout:
              title: 임베딩 실시간 확인 시간이 초과되었습니다
              message: AI_HEALTH_PROBE_TIMEOUT이 되기 전에 임베딩 엔드포인트가 응답하지 않았습니다. 제공업체가
                느리다면 상태 확인 시간 제한을 늘린 다음 모든 프로세스에 환경 변수가 유지되도록 Sure를 재시작하세요. 일반 AI
                채팅 호출도 시간 초과되는 경우 OPENAI_REQUEST_TIMEOUT을 별도로 늘리세요.
            embedding_probe_failed:
              title: 임베딩 실시간 확인에 실패했습니다
              message: Sure에서 설정된 엔드포인트와 모델을 통해 짧은 테스트 임베딩을 생성하지 못했습니다. EMBEDDING_URI_BASE,
                EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN 및 임베딩 제공업체 로그를 확인하세요. 실패 기록은
                설정 → 디버그 로그와 Rails.logger에 저장되었습니다.
            qdrant:
              title: Qdrant 지원은 아직 구현되지 않았습니다
              message: Qdrant 어댑터의 기본 골격은 있지만 현재 문서 업로드와 검색 작업은 실패합니다. 문서 검색에는 OpenAI
                또는 pgvector를 선택하세요.
            missing_vector_store:
              title: 벡터 저장소가 설정되지 않았습니다
              message: 벡터 저장소 어댑터와 필요한 설정을 구성할 때까지 업로드한 문서를 색인하거나 검색할 수 없습니다.
            unavailable_vector_store:
              title: 선택한 벡터 저장소를 사용할 수 없습니다
              message: 아래의 어댑터 요구 사항을 확인하세요. pgvector를 사용하는 경우 데이터베이스에서 벡터 확장 또는 기존
                vector_store_chunks 테이블을 제공해야 합니다.
          llm:
            title: LLM 및 PDF 처리
            description: 실시간 검사는 설정된 모델을 확인하고, 어시스턴트와 같은 방식으로 간단한 함수 호출 하나를 요청한 다음,
              고객 데이터가 포함되지 않은 한 페이지짜리 합성 PDF로 텍스트 추출과 비전/네이티브 처리를 각각 테스트합니다. 자격 증명
