        timeout_description: Sure가 포기하기 전까지 OpenAI 호환 모델 호출을 기다리는 시간을 설정합니다. 느린 하드웨어에서
          로컬 모델을 실행한다면 값을 높이세요.
        openai_request_timeout_label: 요청 시간 초과(초) (선택 사항)
        openai_request_timeout_help: '기본값: 60. 자동 분류, 가맹점 감지, 채팅, PDF 처리, 벡터 저장소 호출을
          포함한 각 OpenAI 호환 HTTP 요청에 적용됩니다. OPENAI_REQUEST_TIMEOUT 환경 변수가 이 값을 덮어씁니다.'
        ai_response_timeout_label: 응답 시간 초과(초) (선택 사항)
        ai_response_timeout_help: '기본값: 90. 채팅의 전체 턴 감시 시간에만 적용되므로 다음을 합산해 설정하세요:
          (1 + ASSISTANT_MAX_TOOL_CALL_ITERATIONS) × 요청 시간 초과 + 도구 실행 시간 및 대기열 시간.
          AI_RESPONSE_TIMEOUT 환경 변수가 이 값을 덮어씁니다.'
        ai_health_probe_timeout_label: 상태 확인 시간 초과(초) (선택 사항)
        ai_health_probe_timeout_help: '기본값: 5. 설정 → 시스템 상태의 실시간 AI 검사에만 적용되며 실제 AI
          호출에는 적용되지 않습니다. 클라우드 모델에서 PDF 검사가 시간 초과되면 값을 높이세요. AI_HEALTH_PROBE_TIMEOUT
