ko:
  settings:
    hostings:
      invite_code_settings:
        description: '%{product} 인스턴스에 새 사용자가 가입하는 방식을 설정합니다.'
        email_confirmation_description: 활성화하면 사용자가 이메일 주소를 변경할 때 새 이메일 주소를 확인해야 합니다.
        email_confirmation_title: 이메일 확인 필수
        default_family_title: 신규 사용자의 기본 가족
        default_family_description: 초대가 없는 신규 사용자만 이 가족/그룹에 배정합니다.
        default_family_none: 없음 (새 가족 만들기)
        generate_tokens: 새 코드 생성
        generated_tokens: 생성된 코드
        title: 온보딩
        states:
          open: 공개
          closed: 닫힘
          invite_only: 초대 전용
      demo_refresh_settings:
        description: 선택한 데모 가족만 자동으로 새로 고칩니다. 해당 가족의 모든 데이터와 로그인 정보가 삭제됩니다. 다른 가족에는
          영향이 없습니다. 최소 2 GiB RAM을 사용하는 실행 중인 워커가 필요합니다. 먼저 데모 생성기로 삭제 가능한 데모 가족을 만든
          다음 여기서 선택하세요. 실제 사용자의 가족은 선택하지 마세요.
        none: 선택된 데모 가족 없음
        family_label: 삭제 가능한 데모 가족
        save_family: 데모 가족 저장
        enabled_label: 매일 데모 가족 새로 고침 사용
      show:
        demo_refresh: 데모 데이터 새로 고침
        general: 일반 설정
        ai_assistant: AI 어시스턴트
        financial_data_providers: 금융 데이터 제공업체
        property_valuation_providers: 부동산 가치 평가 제공업체
        sync_settings: 동기화 설정
        invites: 초대 코드
        title: 셀프 호스팅
        danger_zone: 위험 영역
        instance_settings_restricted: 제공업체 인증 정보, 공용 AI 연결 및 동기화 설정은 이 인스턴스의 모든 가족에
          적용되므로 슈퍼 관리자로만 변경할 수 있습니다. 가족별로 사용하는 어시스턴트는 계속 가족별로 설정할 수 있습니다. 서버에 접근할
          수 있는 사람은 사용자를 슈퍼 관리자로 승격할 수 있습니다. Docker 셀프 호스팅 가이드의 업그레이드 참고 사항에 해당 명령이
          나와 있습니다.
        clear_cache: 데이터 캐시 지우기
        clear_cache_warning: 데이터 캐시를 지우면 모든 환율, 증권 가격, 계좌 잔액 및 기타 데이터가 삭제됩니다. 계좌,
          거래, 카테고리 또는 그 밖의 사용자 소유 데이터는 삭제되지 않습니다.
        confirm_clear_cache:
          title: 데이터 캐시를 지울까요?
          body: 데이터 캐시를 지우시겠습니까? 모든 환율, 증권 가격, 계좌 잔액 및 기타 데이터가 삭제됩니다. 이 작업은 취소할 수
            없습니다.
        reset_market_data: 모든 가족의 시장 데이터 재설정
        reset_market_data_warning: 제공업체에서 다시 불러올 수 있는 환율과 증권 가격을 삭제한 뒤 다시 가져오고, 모든
          계좌를 동기화합니다. 가져오기가 끝날 때까지 외화 합계가 환산되지 않은 상태로 표시될 수 있습니다.
        confirm_reset_market_data:
          title: 모든 가족의 시장 데이터를 재설정할까요?
          body: 이 인스턴스의 모든 가족에 대해 제공업체에서 다시 불러올 수 있는 환율과 증권 가격을 삭제한 뒤 다시 가져옵니다. 가져오기가
            끝날 때까지 외화 금액이 환산되지 않은 상태로 표시될 수 있습니다. 이 작업은 취소할 수 없습니다.
      provider_selection:
        exchange_rate_title: 환율 제공자
        exchange_rate_description: 환율을 가져올 제공자를 하나 선택하세요.
        exchange_rate_provider_label: 환율 제공자
        securities_title: 증권 제공자
        securities_description: 주식, ETF 및 뮤추얼 펀드 가격을 가져올 제공자를 하나 이상 사용 설정하세요. 검색 시
          사용 설정된 모든 제공자에 조회하고 결과를 통합합니다.
        env_configured_message: 환경 변수가 설정되어 있어 제공자를 선택할 수 없습니다. 여기서 선택하려면 설정에서 해당
          환경 변수를 제거하세요.
        twelve_data_hint: API 키 필요, 하루 800 크레딧
        yahoo_finance_hint: 무료, API 키 불필요
        requires_api_key: API 키 필요
        requires_api_key_eodhd: API 키 필요, 하루 20회 호출 제한
        requires_api_key_alpha_vantage: API 키 필요, 하루 25회 호출 제한
        mfapi_hint: 무료, API 키 불필요 -- 인도 뮤추얼 펀드 전용
        binance_public_hint: 무료, API 키 불필요 -- 암호화폐 전용(BTC, ETH 등)
        moex_public_hint: 무료, API 키 불필요 -- 러시아 주식, 펀드 및 채권(MOEX), RUB 환율 포함
        tinkoff_invest_hint: 읽기 전용 토큰 필요 -- 러시아 주식/펀드/채권 가격 및 브랜드 로고
        requires_api_key_mansa: API 키 필요, 무료 요금제 하루 100회 호출 -- 아프리카 거래소(NGX, JSE,
          NSE, GSE, BRVM 등)
        providers:
          twelve_data: Twelve Data
          yahoo_finance: Yahoo Finance
          tiingo: Tiingo
          eodhd: EODHD
          alpha_vantage: Alpha Vantage
          mfapi: MFAPI.in
          binance_public: Binance
          moex_public: MOEX
          tinkoff_invest: T-Invest (T-Bank)
          frankfurter: Frankfurter
          mansa: Mansa
      assistant_settings:
        title: AI 어시스턴트
        description: 채팅 어시스턴트의 응답 방식을 선택하세요. Builtin은 설정한 LLM 제공자를 직접 사용합니다. External은
          MCP를 통해 Sure의 금융 도구를 호출할 수 있는 원격 AI 에이전트에 위임합니다. None in app을 선택하면 앱 내 채팅이
          제거되고 MCP는 자체 에이전트용으로 계속 사용할 수 있습니다.
        type_label: 어시스턴트 유형
        type_builtin: Builtin (직접 LLM 사용)
        type_external: External (원격 에이전트)
        type_mcp_only: None in app (MCP로 자체 에이전트 연결)
        mcp_only_help: 이 가구의 모든 사용자에게 앱 내 어시스턴트가 꺼집니다. 청구서 AI 바로가기와 AI가 작성하는 인사이트
          문구도 중단됩니다. MCP와 백그라운드 분류는 계속 사용할 수 있습니다. 설정 > MCP에서 외부 에이전트를 연결하세요.
        external_status: 외부 어시스턴트 엔드포인트
        external_configured: 구성됨
        external_not_configured: 구성되지 않았습니다. 아래에 URL과 토큰을 입력하거나 EXTERNAL_ASSISTANT_URL
          및 EXTERNAL_ASSISTANT_TOKEN 환경 변수를 설정하세요.
        env_notice: ASSISTANT_TYPE 환경 변수를 통해 어시스턴트 유형이 '%{type}'(으)로 고정되어 있습니다.
        env_configured_external: 환경 변수를 통해 성공적으로 구성되었습니다.
        url_label: 엔드포인트 URL
        url_placeholder: https://your-agent-host/v1/chat
        url_help: 에이전트 API 엔드포인트의 전체 URL입니다. 에이전트 제공자가 알려줍니다.
        token_label: API 토큰
        token_placeholder: 에이전트 제공자가 발급한 토큰을 입력하세요
        token_help: 외부 에이전트가 제공한 인증 토큰입니다. 각 요청에 Bearer 토큰으로 전송됩니다.
        agent_id_label: 에이전트(필수)
        agent_id_placeholder: main (default)
        agent_id_help: Sure는 엔드포인트의 /v1/models 응답에서 이 목록을 가져옵니다. 선택한 에이전트가 라우팅을 제어하며,
          기반 모델은 외부 서비스에서 관리합니다.
        agent_discovery_configure_first: 사용 가능한 에이전트를 불러오려면 유효한 엔드포인트 URL과 API 토큰을
          저장하세요.
        external_agent_required: 저장하기 전에 외부 에이전트를 선택하세요.
        external_agent_invalid: 구성된 엔드포인트가 반환한 에이전트를 선택하세요.
        external_agent_reselect: 엔드포인트가 변경되어 이전에 선택한 에이전트를 사용할 수 없습니다. 새 엔드포인트에서 에이전트를
          선택하세요.
        agent_discovery_error: '에이전트를 불러오지 못했습니다: %{error}'
        external_info:
          title: 외부 AI 구성
          items:
          - /v1/chat/completions로 끝나는 OpenAI 호환 엔드포인트 URL 전체를 입력하세요.
          - 엔드포인트와 토큰을 저장하면 Sure가 /v1/models에서 사용 가능한 에이전트를 검색합니다.
          - 각 에이전트에서 사용할 모델은 외부 서비스가 선택하며, Sure는 에이전트 경로만 선택합니다.
          - 인증, 엔드포인트 또는 에이전트 오류는 외부 서비스가 반환합니다. 요청이 실패하면 해당 서비스 로그를 확인하세요.
        disconnect_title: 외부 연결
        disconnect_description: 외부 어시스턴트 연결을 제거하고 기본 제공 어시스턴트로 전환합니다.
        disconnect_button: 연결 해제
        confirm_disconnect:
          title: 외부 어시스턴트 연결을 해제할까요?
          body: 저장된 URL, 토큰 및 에이전트 ID가 제거되고 기본 제공 어시스턴트로 전환됩니다. 새 인증 정보를 입력하면 나중에
            다시 연결할 수 있습니다.
      brand_fetch_settings:
        description: Brandfetch에서 제공한 Client ID를 입력하세요
        env_configured_message: BRAND_FETCH_CLIENT_ID 환경 변수를 통해 Brandfetch Client
          ID가 성공적으로 구성되었습니다.
        show_details: (세부 정보 표시)
        setup_step_1_html: 무료 Brandfetch 개발자 계정을 만들려면 <a href="https://brandfetch.com/developers"
          target="_blank" rel="noopener noreferrer" class="underline">brandfetch.com</a>을
          방문하세요.
        setup_step_2_html: <a href="https://developers.brandfetch.com/dashboard/logo-api"
          target="_blank" rel="noopener noreferrer" class="underline">Logo API</a>
          페이지로 이동하세요.
        setup_step_3: '"Your Client ID" 섹션 아래의 눈 아이콘을 눌러 Client ID를 표시한 다음 아래에 붙여넣으세요.'
        label: Client ID
        placeholder: Client ID를 여기에 입력하세요
        title: Brandfetch 설정
        high_res_label: 고해상도 로고 사용
        high_res_description: 사용 설정하면 로고를 40x40 대신 120x120 해상도로 가져옵니다. 고DPI 디스플레이에서
          더 선명하게 표시됩니다.
      llm_provider_selector:
        title: AI 제공업체
        description: AI 채팅, 가맹점 감지 및 PDF 처리를 담당할 LLM을 선택하세요. 거래 분류는 아래에서 별도로 설정합니다.
        env_configured_message: LLM_PROVIDER 환경 변수로 성공적으로 설정되었습니다.
        provider_label: 활성 LLM 제공업체
        provider_openai: OpenAI
        provider_anthropic: Anthropic (Claude)
        provider_help: 제공업체를 변경하면 다음 채팅부터 적용됩니다. 아래에서 활성 제공업체의 인증 정보를 설정하세요.
        not_configured_hint: 활성화하려면 아래에 %{provider} API 키를 추가하세요.
        data_retention_heading: 데이터 처리
        data_retention: 기본적으로 API 입력은 모델 학습에 사용되지 않습니다. 제공업체의 호스팅 API는 신뢰 및 안전 목적상
          데이터를 약 30일간 보관합니다. 사용자 지정 또는 자체 호스팅 엔드포인트는 각자의 정책을 따릅니다.
        max_items_per_call_label: 배치당 최대 항목 수 (선택 사항)
        max_items_per_call_help: '자동 분류 / 가맹점 감지 배치의 최대 크기입니다. 기본값: 25. OpenAI 호환
          제공업체에서는 컨텍스트 창에 맞도록 큰 배치를 자동으로 나눕니다.'
      anthropic_settings:
        title: Anthropic (Claude)
        description: Anthropic API 키를 입력하세요. 선택적으로 Base URL을 AWS Bedrock 또는 GCP Vertex로
          지정할 수 있습니다.
        env_configured_message: 환경 변수로 성공적으로 설정되었습니다.
        access_token_label: API 키
        access_token_placeholder: Anthropic API 키 입력
        base_url_label: Base URL (선택 사항)
        base_url_placeholder: https://api.anthropic.com (기본값)
        model_label: 기본 모델 (선택 사항)
        model_placeholder: claude-sonnet-4-6 (기본값)
        model_help: 채팅 및 PDF 처리에 사용됩니다. 배치 작업(분류, 가맹점 감지)은 비용 절감을 위해 기본적으로 Haiku를
          사용합니다.
      categorization_provider_selector:
        title: 거래 분류
        preview_pill: 미리 보기
        description: 거래를 분류할 제공업체를 선택하세요. 이는 위의 AI 제공업체와 별개이며, 위 제공업체는 채팅과 PDF 처리를
          담당합니다.
        env_notice: 환경 변수를 통해 %{type}(으)로 설정되어 있습니다.
        provider_label: 분류 제공업체
        provider_llm: AI 제공업체 (OpenAI 또는 Anthropic)
        provider_jev: Jev (TypeSafe)
        provider_help: AI 제공업체는 거래 배치를 읽고 분류명을 기록합니다. Jev는 사용자의 분류 목록에서 항목을 선택하고 거래마다
          보정된 신뢰도를 반환합니다.
        jev_configured: Jev API 키가 설정되었습니다.
        jev_not_configured: Jev가 선택되었지만 API 키가 설정되지 않았습니다. 아래에서 키를 추가할 때까지 AI 제공업체를
          계속 사용합니다.
        data_retention_heading: 데이터 공유
        data_retention_direct: 분류를 위해 거래 설명, 금액 및 분류명이 TypeSafe로 전송됩니다. 실제 데이터에 이
          기능을 사용하기 전에 TypeSafe의 보관 정책을 확인하세요.
        data_retention_proxied: 거래 설명, 금액 및 분류명이 %{host}를 거쳐 TypeSafe로 전송됩니다. 실제 데이터에
          이 기능을 사용하기 전에 두 제공업체의 보관 정책을 확인하세요.
        confidence_threshold_label: 최소 신뢰도 (0–1)
        confidence_threshold_help: 이 신뢰도보다 낮으면 분류가 적용되지 않고 거래가 미분류 상태로 남으므로 다음 실행에서
          다시 시도할 수 있습니다. 데이터는 폐기되지 않습니다. 모든 응답을 적용하려면 0으로 설정하세요.
        confidence_threshold_env_notice: CATEGORIZATION_CONFIDENCE_THRESHOLD 환경 변수로
          잠겨 있습니다.
        shadow_rate_label: 섀도 비교 비율 (0–1)
        shadow_rate_help: 선택한 제공업체와 함께 선택하지 않은 제공업체도 실행하여, 분류를 변경하지 않고 두 결과가 다른 지점을
          기록합니다. 샘플링되는 각 분류 실행의 API 비용이 두 배가 됩니다. 끄려면 0으로 설정하세요.
        shadow_rate_env_notice: CATEGORIZATION_SHADOW_RATE 환경 변수로 잠겨 있습니다.
      categorization_shadow_results:
        shadow_results_heading: 섀도 비교
