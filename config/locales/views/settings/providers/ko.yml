          추적합니다.
        snaptrade: SnapTrade 통합 네트워크를 통해 증권 계좌를 연결합니다.
        trading212: 읽기 전용 API 키로 Trading 212 투자 포트폴리오를 동기화합니다.
        sharesight: Sharesight에서 추적하는 포트폴리오를 API로 동기화합니다.
        trade_republic: 안전한 읽기 전용 웹 로그인으로 Trade Republic 투자 계좌를 동기화합니다.
        ibkr: Flex Query 가져오기로 Interactive Brokers 투자 계좌를 동기화합니다.
        questrade: Questrade API로 투자 계좌를 직접 동기화합니다.
        indexa_capital: Indexa Capital 자동 투자 포트폴리오를 추적합니다.
        sophtron: 미국 및 캐나다의 은행과 공공요금 계좌를 연결합니다.
        plaid: Plaid를 통해 수천 개의 미국 금융기관을 연결합니다.
        plaid_eu: Plaid(PSD2 / Open Banking)를 통해 유럽 금융기관을 연결합니다.
