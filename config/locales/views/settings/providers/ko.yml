        coinstats: 여러 지갑과 거래소의 전체 암호화폐 포트폴리오를 추적합니다.
        wise: Wise 다중 통화 잔액과 해외 이체 내역을 자동으로 동기화합니다.
        mercury: Mercury 사업자 금융 계좌를 자동으로 동기화합니다.
        brex: 읽기 전용 접근으로 Brex 현금 및 법인 카드 내역을 동기화합니다.
        coinbase: Coinbase 암호화폐 보유 자산을 가져와 성과를 추적합니다.
        binance: 읽기 전용 API 키로 Binance 현물 잔액을 동기화합니다.
        kraken: 읽기 전용 API 키로 Kraken 잔액과 현물 거래 체결 내역을 동기화합니다.
        coinspot: 읽기 전용 API 키로 CoinSpot 잔액, AUD 평가액, 이체, 입금, 출금 및 주문 내역을 동기화합니다.
