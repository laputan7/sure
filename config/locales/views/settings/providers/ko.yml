        simplefin: 개방형 SimpleFIN 프로토콜로 미국 은행 계좌를 연결합니다.
        lunchflow: 40여 개국(영국, EU, 미국 등)의 2만여 개 은행을 연결합니다.
        redbark: Redbark 오픈뱅킹으로 호주 은행 계좌를 동기화합니다.
        up: 개인 액세스 토큰으로 호주 Up 은행 계좌를 동기화합니다.
        monobank: 개인 API 토큰으로 우크라이나 Monobank 카드와 예치 계좌를 동기화합니다.
        fio: 읽기 전용 API 토큰으로 Fio banka 계좌를 동기화합니다.
        enable_banking: PSD2 오픈뱅킹으로 유럽 은행 계좌를 동기화합니다.
