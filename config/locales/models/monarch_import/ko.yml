ko:
  activerecord:
    errors:
      models:
        monarch_import:
          missing_columns: "%{file} 파일에 %{columns} 열이 없습니다. 올바른 Monarch 내보내기 파일인가요?"
          malformed_csv: "%{file} 파일은 읽을 수 있는 CSV가 아닙니다: %{error}"
          invalid_number: "%{value}은(는) 숫자가 아닙니다"
          invalid_date: "%{value}은(는) 2024-01-31 형식의 날짜가 아닙니다"
          date_out_of_range: "%{value}은(는) Sure가 가져오는 날짜 범위(%{from}~%{to})를 벗어났습니다"
          blank_account: 계좌 이름이 없는 행이 있습니다. Monarch 내보내기 파일인지 확인하세요.
          blank_transaction_id: Id가 없는 거래가 있습니다. Monarch 거래 내보내기 파일인지 확인하세요.
          opening_balance_changed: "%{account} 계좌의 기초 잔액이 가져오는 동안 변경되었습니다. 가져오기 내용을 검토한 후 다시 게시하세요."
          target_not_supported: "Sure는 더 이상 %{accounts}에 가져올 수 없습니다. 대상은 보유 자산이나 거래 내역이 없는 수동 계좌여야 합니다. 다른 대상을 선택한 후 다시 게시하세요."
          no_accounts: 내보내기 파일에 계좌가 없습니다. Monarch에서 올바른 파일을 내보냈는지 확인하세요.
          files:
            balances: 잔액
            transactions: 거래
        import/monarch_account_mapping:
          target_taken: "%{account}은(는) 이미 다른 Monarch 계좌의 대상입니다. %{monarch}에 다른 계좌를 선택하거나 새 계좌로 가져오세요."
