ko:
  activerecord:
    attributes:
      goal:
        name: 이름
        target_amount: 목표 금액
        currency: 통화
        target_date: 목표 날짜
        color: 색상
        notes: 메모
        state: 상태
        linked_accounts: 연결된 계좌
    errors:
      models:
        goal:
          attributes:
            base:
              missing_exchange_rate: 이 목표의 계좌 중 하나에 대한 환율이 아직 없어 완료할 수 없습니다.
              at_least_one_linked_account_required: 이 목표에 자금을 마련할 계좌를 하나 이상 선택하세요.
              whole_account_conflict_on_restore: "이 목표를 복원할 수 없습니다. “%{account_name}” 계좌는 이제 “%{goal_name}”에 전액 배정되어 있습니다. 먼저 둘 중 하나에 금액을 입력하세요."
            target_mode:
              months_requires_maintained: 계속 유지하는 예비 자금만 지출 개월 수로 목표를 설정할 수 있습니다.
            target_months:
              blank: 이 예비 자금으로 충당할 지출 개월 수를 입력하세요.
              only_with_months_mode: 목표를 지출 개월 수로 설정한 경우에만 지출 개월 수를 사용할 수 있습니다.
            linked_accounts:
              must_be_fundable: 연결된 계좌는 모두 현금, 투자 또는 암호화폐 계좌여야 합니다.
              must_belong_to_family: 연결된 계좌는 목표와 같은 가족에 속해야 합니다.
            kind:
              locked_while_released: 이 목표를 예비 자금으로 바꾸려면 다시 열어야 합니다.
              locked_once_consumed: 이 목표는 이미 지출한 금액을 기록했으므로 예비 자금으로 바꿀 수 없습니다.
            target_amount:
              below_consumed: 이 목표가 이미 지출한 것으로 기록한 금액보다 낮게 목표 금액을 설정할 수 없습니다.
            currency:
              locked_after_linked: 계좌에 목표를 연결한 후에는 통화를 변경할 수 없습니다.
